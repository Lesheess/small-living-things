<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape eyes</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #1b1d22; color: #d9dadf; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  .bar { height: 32px; background: #2a2c33; position: relative; }
  .bar .notch { position: absolute; left: 50%; top: 0; width: 200px; height: 32px; margin-left: -100px; background: #000; border-radius: 0 0 12px 12px; }
  canvas { display: block; }
  #pill { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
  .stage { position: relative; height: 170px; }
  .lead { text-align: center; color: #8b8d96; margin: 4px 16px 14px; }
  .big { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 260px)); gap: 16px; justify-content: center; padding: 0 16px; }
  .big figure { margin: 0; background: #000; border-radius: 26px; padding: 10px 0 10px; cursor: pointer; outline: 2px solid transparent; }
  .big figure[aria-current=true] { outline-color: #5d6170; }
  .big canvas { margin: 0 auto; }
  .big figcaption { text-align: center; color: #8b8d96; font-size: 12px; padding-top: 6px; }
  .ctl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 22px 16px 40px; }
  button { font: inherit; color: #e8e9ee; background: #2c2f37; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  button[aria-pressed=true] { background: #e8e9ee; color: #111; }
  .sep { width: 18px; }
</style>
</head>
<body>
<div class="stage">
  <div class="bar"><div class="notch"></div></div>
  <canvas id="pill"></canvas>
</div>
<p class="lead">Six designs, all alive the same way. Click one to put it in the pill.</p>
<div class="big" id="grid"></div>
<div class="ctl">
  <button data-who="madam" aria-pressed="true">Madam</button>
  <button data-who="gentleman" aria-pressed="false">Gentleman</button>
  <span class="sep"></span>
  <button data-act="caught">Caught</button>
  <button data-act="happy">Glad</button>
  <button data-act="sad">Sad</button>
  <button data-act="sleepy">Sleepy</button>
  <button data-act="blink">Blink</button>
</div>
<script>
/* Eyes as two light shapes. Emotion is only their outline (lids cutting in from above and below, a tilt, a squash)
   and timing (springs). Madam: the outer top corner pulled up and out, a cat-eye. The Gentleman: a flatter, heavier top. */
const DPR = Math.max(1, window.devicePixelRatio || 1);
let who = "madam";
const CHAR = {
  madam:     { k: 260, c: 19, rest: 0.0,  flick: 1, glance: [0.9, 2.4] },
  gentleman: { k: 120, c: 17, rest: 0.2,  flick: 0, glance: [2.2, 4.8] },
};
/* the designs: proportions of the eye, corner roundness, pupil, and how it is painted */
const VARIANTS = [
  { id: "A", name: "Soft square",          ratio: 0.86, rad: 0.44, pupil: 0,    paint: "fill" },
  { id: "B", name: "Soft square, pupil",   ratio: 0.86, rad: 0.44, pupil: 0.22, paint: "fill" },
  { id: "C", name: "Tall oval, pupil",     ratio: 0.68, rad: 0.5,  pupil: 0.27, paint: "fill" },
  { id: "D", name: "Glow",                 ratio: 0.86, rad: 0.44, pupil: 0,    paint: "glow" },
  { id: "E", name: "Wide capsule, pupil",  ratio: 1.3,  rad: 0.5,  pupil: 0.3,  paint: "fill", h: 0.72 },
  { id: "F", name: "Round, pupil",         ratio: 1,    rad: 0.5,  pupil: 0.3,  paint: "fill", h: 0.9 },
];
let current = VARIANTS[1];
/* a spring per number */
function S(v) { return { v, x: v, t: v }; }
function step(s, dt, k, c) { const a = k*(s.t - s.x) - c*s.v0; s.v0 = (s.v0 || 0) + a*dt; s.x += s.v0*dt; }
function spring(v) { return { x: v, t: v, v0: 0 }; }

/* per eye: top lid (fraction of height), its tilt (+ = inner corner lower), bottom lid, how far it rises in the middle,
   open (1 open, 0 shut), and a whole-face gaze */
const eyes = [0, 1].map(() => ({ top: spring(0), tilt: spring(0), bot: spring(0), rise: spring(0), open: spring(1), grow: spring(1) }));
const gaze = { x: spring(0), y: spring(0) };
const pupil = { r: spring(1) };            /* a multiplier on the design's own pupil */
let scene = null, sceneT = 0, nextGlance = 1, blinkUntil = 0, nextBlink = 2.5;
let mouse = { x: innerWidth/2, y: 400 };
addEventListener("pointermove", e => { mouse = { x: e.clientX, y: e.clientY }; });

function setRest() {
  const ch = CHAR[who];
  eyes.forEach(e => { e.top.t = ch.rest; e.tilt.t = 0; e.bot.t = 0; e.rise.t = 0; e.grow.t = 1; });
  pupil.r.t = 1;
}

/* ---- scenes: functions of time u that set targets ---- */
const SCENES = {
  caught(u, ch) {
    const m = who === "madam";
    if (u < 0.8) {                                   /* caught you: wide */
      eyes.forEach(e => { e.top.t = 0; e.grow.t = 1.14; e.bot.t = 0; });
      pupil.r.t = 0.85; lookAtPointer(1);
    } else {                                         /* the squint, one eye more than the other */
      eyes.forEach((e, i) => { const left = i === 0;
        e.top.t = (m ? 0.24 : 0.32) + (left ? 0.08 : 0); e.tilt.t = 0.04; e.bot.t = left ? 0.13 : 0.09; e.rise.t = 0.7; e.grow.t = 1; });
      pupil.r.t = 0.78;
      if (u > 2.6 && u < 4.4) {                      /* looking you over, down and back up */
        const p = (u - 2.6)/1.8; gaze.x.t = 0; gaze.y.t = Math.sin(p*Math.PI)*0.95;
      } else lookAtPointer(1);
    }
    if (u > 6.1 && u < 6.45) eyes.forEach(e => e.open.t = 0.04); else eyes.forEach(e => e.open.t = 1);
    return u < 9.6;
  },
  happy(u) {
    eyes.forEach(e => { e.top.t = 0; e.bot.t = 0.5; e.rise.t = 1.25; e.tilt.t = 0; e.grow.t = 1.04; });
    gaze.x.t = 0; gaze.y.t = -0.25; return u < 2.6;
  },
  sad(u) {
    eyes.forEach(e => { e.top.t = 0.26; e.tilt.t = -0.2; e.bot.t = 0.06; e.rise.t = 0; e.grow.t = 0.94; });
    gaze.x.t = -0.2; gaze.y.t = 0.7; pupil.r.t = 1.12; return u < 3.4;
  },
  sleepy(u) {
    const d = 0.55 + 0.12*Math.sin(u*1.7);
    eyes.forEach(e => { e.top.t = d; e.tilt.t = -0.04; e.bot.t = 0.05; e.rise.t = 0; e.grow.t = 1; });
    gaze.x.t = 0; gaze.y.t = 0.45; return u < 4.2;
  },
  blink(u) { eyes.forEach(e => e.open.t = u < 0.12 ? 0.04 : 1); return u < 0.6; },
};
function lookAtPointer(k) {
  const r = pillCanvas.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height*0.4;
  const dx = mouse.x - cx, dy = mouse.y - cy, d = Math.max(1, Math.hypot(dx, dy)), f = Math.min(1, d/380)*k;
  gaze.x.t = dx/d*f; gaze.y.t = dy/d*f*0.8;
}

/* ---- drawing one eye ---- */
function eyePath(ctx, w, h, right, flick, rad = 0.44) {
  const s = right ? 1 : -1, hw = w/2, hh = h/2, r = Math.min(w, h)*rad;
  const TL = [-hw, -hh], TR = [hw, -hh], BR = [hw, hh], BL = [-hw, hh];
  const outer = right ? TR : TL;
  outer[1] -= flick*h*0.08; outer[0] += s*flick*w*0.22;          /* her outer corner runs out into a point: a cat-eye */
  const rOuter = flick ? r*0.18 : r, rInner = flick ? r*0.9 : (rad >= 0.5 ? r : r*0.75);
  const rTL = right ? rInner : rOuter, rTR = right ? rOuter : rInner;
  const p = new Path2D();
  p.moveTo(0, hh);
  p.arcTo(BL[0], BL[1], TL[0], TL[1], r);
  p.arcTo(TL[0], TL[1], TR[0], TR[1], rTL);
  p.arcTo(TR[0], TR[1], BR[0], BR[1], rTR);
  p.arcTo(BR[0], BR[1], BL[0], BL[1], r);
  p.closePath(); return p;
}
function lidClip(w, h, e, right) {
  const s = right ? 1 : -1, hw = w/2, hh = h/2, W = w*0.9, top = e.top.x, a = e.tilt.x;
  const away = (1 - Math.min(1, top*8))*h*0.4;                       /* lid fully up: out of the way of her flick */
  const yIn = -hh + (top + a)*h - away, yOut = -hh + (top - a)*h - away, bow = -h*0.1*Math.min(1, top*2.5);   /* the lid's edge arches a little, like a lid */
  const yB = hh - e.bot.x*h, rise = h*0.3*e.rise.x*Math.min(1, e.bot.x*4);
  const xL = -W, xR = W, yL = right ? yIn : yOut, yR = right ? yOut : yIn;
  const p = new Path2D();
  p.moveTo(xL, yL); p.quadraticCurveTo(0, (yL + yR)/2 + bow, xR, yR);
  p.lineTo(xR, yB); p.quadraticCurveTo(0, yB - rise*2, xL, yB); p.closePath(); return p;
}
function lidLines(w, h, e, right) {
  const hw = w/2, hh = h/2, W = w*0.9, top = e.top.x, a = e.tilt.x;
  const away = (1 - Math.min(1, top*8))*h*0.4;
  const yIn = -hh + (top + a)*h - away, yOut = -hh + (top - a)*h - away, bow = h*0.18*Math.min(1, top*2);
  const yB = hh - e.bot.x*h, rise = h*0.3*e.rise.x*Math.min(1, e.bot.x*4);
  const yL = right ? yIn : yOut, yR = right ? yOut : yIn, p = new Path2D();
  p.moveTo(-W, yL); p.quadraticCurveTo(0, (yL + yR)/2 + bow, W, yR);
  p.moveTo(W, yB); p.quadraticCurveTo(0, yB - rise*2, -W, yB); return p;
}
function drawFace(ctx, cx, cy, H0, v) {
  const ch = CHAR[who], H = H0*(v.h || 1), W = H*v.ratio, gap = H0*(who === "madam" ? 0.42 : 0.36);
  for (let i = 0; i < 2; i++) {
    const e = eyes[i], right = i === 1, s = right ? 1 : -1;
    /* the eye on the side you look toward grows a touch, the other shrinks: they are on a round face */
    const persp = 1 + 0.07*gaze.x.x*s;
    const w = W*persp*e.grow.x, h = H*persp*e.grow.x*Math.max(0.04, e.open.x);
    const ex = cx + s*(W/2 + gap/2) + gaze.x.x*W*0.32, ey = cy + gaze.y.x*H*0.2 + (1 - e.open.x)*H*0.08;
    ctx.save(); ctx.translate(ex, ey);
    const shape = eyePath(ctx, w, h, right, ch.flick, v.rad), fullH = H*persp*e.grow.x;
    const lw = Math.max(1.5, H0*0.075);
    if (v.paint === "glow") {
      /* a soft light around the lit shape, like a lamp behind frosted glass */
      ctx.save(); ctx.clip(lidClip(w, fullH, e, right)); ctx.shadowColor = "rgba(225, 232, 255, 0.55)"; ctx.shadowBlur = H0*0.3;
      ctx.fillStyle = "#f7f8fc"; ctx.fill(shape); ctx.restore();
    } else if (v.paint === "line") {
      /* drawn with a line, the lids too, so it reads like the system's own icons */
      ctx.save(); ctx.clip(lidClip(w, fullH, e, right)); ctx.strokeStyle = "#f1f1f4"; ctx.lineWidth = lw; ctx.stroke(shape); ctx.restore();
      ctx.save(); ctx.clip(shape); ctx.strokeStyle = "#f1f1f4"; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.stroke(lidLines(w, fullH, e, right)); ctx.restore();
    } else {
      ctx.save(); ctx.clip(lidClip(w, fullH, e, right));
      const g = ctx.createLinearGradient(0, -h/2, 0, h/2); g.addColorStop(0, "#f4f4f6"); g.addColorStop(1, "#d3d4da");
      ctx.fillStyle = g; ctx.fill(shape); ctx.restore();
    }
    if (v.pupil && e.open.x > 0.25) {
      ctx.save(); ctx.clip(lidClip(w, fullH, e, right)); ctx.clip(shape);
      const pr = Math.min(w, H)*v.pupil*pupil.r.x, px = gaze.x.x*w*0.22, py = gaze.y.x*h*0.2 + h*0.04;
      ctx.fillStyle = v.paint === "line" ? "#f1f1f4" : "#16171b"; ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2); ctx.fill(); ctx.restore();
    }
    ctx.restore();
  }
}

/* ---- canvases ---- */
const pillCanvas = document.getElementById("pill");
function size(c, w, h) { c.width = w*DPR; c.height = h*DPR; c.style.width = w + "px"; c.style.height = h + "px"; return c.getContext("2d"); }
const PW = 344, PH = 128;
const pc = size(pillCanvas, PW + 12, PH);
const grid = document.getElementById("grid");
const cards = VARIANTS.map(v => {
  const fig = document.createElement("figure"), cv = document.createElement("canvas"), cap = document.createElement("figcaption");
  cap.textContent = v.id + " · " + v.name; fig.append(cv, cap); grid.append(fig);
  fig.setAttribute("aria-current", v === current);
  fig.onclick = () => { current = v; document.querySelectorAll(".big figure").forEach(f => f.setAttribute("aria-current", f === fig)); };
  return { v, ctx: size(cv, 240, 120) };
});
const LINES = { madam: "Going, you said. Darling, I can see you.", gentleman: "A remarkably brief stroll, if I may say so." };

function drawPill(ctx, u) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, PW + 12, PH);
  /* the card under the notch, with little flares where it meets the bar */
  const f = 6, w = PW, h = PH - 8;
  ctx.fillStyle = "#000"; ctx.beginPath();
  ctx.moveTo(0, 0); ctx.arcTo(f, 0, f, f, f); ctx.lineTo(f, h - 26); ctx.arcTo(f, h, f + 26, h, 26);
  ctx.lineTo(f + w - 26, h); ctx.arcTo(f + w, h, f + w, h - 26, 26); ctx.lineTo(f + w, f); ctx.arcTo(f + w, 0, f + w + f, 0, f); ctx.closePath(); ctx.fill();
  drawFace(ctx, f + w/2, 32 + 26, 36, current);
  const a = scene === "caught" ? Math.max(0, Math.min(1, (u - 1.6)/0.5)) : 0;
  if (a > 0) { ctx.globalAlpha = a; ctx.fillStyle = "#fff"; ctx.font = "600 15px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center"; ctx.fillText(LINES[who], f + w/2, 102); ctx.globalAlpha = 1; }
}
function drawBig(ctx, v) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, 240, 120);
  drawFace(ctx, 120, 60, 66, v);
}

/* ---- the loop ---- */
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(0.033, (now - last)/1000); last = now; t += dt;
  const ch = CHAR[who];
  if (scene) {
    sceneT += dt;
    if (!SCENES[scene](sceneT, ch)) { scene = null; setRest(); }
  } else {
    /* idle: watching you, glancing about now and then, blinking */
    if (t > nextGlance) { nextGlance = t + ch.glance[0] + Math.random()*(ch.glance[1] - ch.glance[0]);
      if (Math.random() < 0.55) { gaze.x.t = (Math.random()*2 - 1)*0.8; gaze.y.t = (Math.random()*2 - 1)*0.5; if (Math.random() < 0.5) blinkUntil = t + 0.11; }
      else lookAtPointer(1); }
    if (t > nextBlink) { blinkUntil = t + 0.11; nextBlink = t + 2 + Math.random()*4; if (who === "madam" && Math.random() < 0.35) setTimeout(() => blinkUntil = t + 0.1, 260); }
    eyes.forEach(e => e.open.t = t < blinkUntil ? 0.04 : 1);
  }
  const k = ch.k, c = ch.c, n = 4, h = dt/n;
  for (let j = 0; j < n; j++) {
    for (const e of eyes) for (const key in e) step(e[key], h, key === "open" ? 900 : k, key === "open" ? 50 : c);
    step(gaze.x, h, k, c); step(gaze.y, h, k, c); step(pupil.r, h, k, c);
  }
  drawPill(pc, sceneT);
  cards.forEach(c => drawBig(c.ctx, c.v));
  requestAnimationFrame(frame);
}
setRest(); requestAnimationFrame(frame);

document.querySelectorAll("[data-who]").forEach(b => b.onclick = () => {
  who = b.dataset.who; document.querySelectorAll("[data-who]").forEach(x => x.setAttribute("aria-pressed", x === b)); scene = null; setRest(); });
document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => { setRest(); scene = b.dataset.act; sceneT = 0; });
/* start with the caught scene once, so it is the first thing seen */
setTimeout(() => { scene = "caught"; sceneT = 0; }, 700);
</script>
</body>
</html>
